<style>
:root{--bg:#07090f;--surface:#0e1118;--surface2:#141720;--border:#1e2233;--muted:#3d4460;--label:#5a6480;--sub:#7a88a8;--text:#dde4f0;--text2:#a8b4cc;--indigo:#5d6cf5;--indigo-dim:#5d6cf520;--violet:#8b5cf6;--green:#0fb97a;--green-dim:#0fb97a20;--amber:#f4a21a;--amber-dim:#f4a21a20;--red:#f06060;--red-dim:#f0606020;--teal:#0dc8b0;--teal-dim:#0dc8b020;--font:'Segoe UI',system-ui,sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;}
#app{display:flex;flex-direction:column;min-height:100vh;}
#header{background:#090b13;border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;position:sticky;top:0;z-index:100;}
#header h1{font-size:17px;font-weight:700;}
#header .sub{font-size:9px;color:var(--label);letter-spacing:1px;margin-top:1px;}
.hdr-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
#sync-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block;margin-right:2px;transition:background .3s;}
#tabs{background:#090b13;border-bottom:1px solid var(--border);padding:0 20px;display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.tab-btn{background:none;border:none;color:var(--sub);padding:11px 14px;font-size:13px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:color .15s;}
.tab-btn:hover{color:var(--text);}
.tab-btn.active{color:var(--teal);border-bottom-color:var(--teal);}
#main{flex:1;padding:18px 20px;max-width:1100px;margin:0 auto;width:100%;}
.btn{border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;transition:opacity .15s,transform .1s;white-space:nowrap;}
.btn:active{transform:scale(.97);}
.btn:hover{opacity:.85;}
.btn-teal{background:var(--teal);color:#07090f;}
.btn-indigo{background:var(--indigo);color:#fff;}
.btn-green{background:var(--green);color:#07090f;}
.btn-amber{background:var(--amber);color:#07090f;}
.btn-red{background:transparent;color:var(--red);border:1px solid var(--red);}
.btn-ghost{background:var(--surface2);color:var(--text2);border:1px solid var(--border);}
.btn-sm{padding:4px 10px;font-size:12px;}
.btn-xs{padding:3px 8px;font-size:11px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;}
.stat-card{background:var(--surface);border-radius:12px;padding:14px 18px;}
.stat-label{font-size:10px;color:var(--label);letter-spacing:1px;text-transform:uppercase;}
.stat-value{font-size:20px;font-weight:700;margin:3px 0;}
.stat-sub{font-size:11px;color:var(--muted);}
.grid-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:10px;margin-bottom:18px;}
.field{display:flex;flex-direction:column;gap:4px;}
.field label{font-size:11px;color:var(--label);letter-spacing:.4px;}
input,select,textarea{background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:8px 11px;font-size:13px;font-family:var(--font);width:100%;transition:border-color .15s;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal);}
select option{background:var(--surface2);}
textarea{resize:vertical;min-height:56px;}
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:10px;margin-bottom:10px;}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;}
.badge-green{background:var(--green-dim);color:var(--green);}
.badge-amber{background:var(--amber-dim);color:var(--amber);}
.badge-red{background:var(--red-dim);color:var(--red);}
.badge-indigo{background:var(--indigo-dim);color:var(--indigo);}
.badge-teal{background:var(--teal-dim);color:var(--teal);}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:1000;display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;width:100%;max-width:680px;margin:auto;}
.modal-header{padding:18px 20px 0;display:flex;justify-content:space-between;align-items:flex-start;}
.modal-header h2{font-size:16px;font-weight:700;}
.modal-close{background:none;border:none;color:var(--sub);cursor:pointer;font-size:22px;padding:0 4px;line-height:1;}
.modal-body{padding:18px 20px;}
.modal-footer{padding:0 20px 18px;display:flex;gap:8px;justify-content:flex-end;}
.tbl{width:100%;border-collapse:collapse;font-size:13px;}
.tbl th{color:var(--label);font-size:10px;letter-spacing:.8px;text-transform:uppercase;padding:8px 10px;border-bottom:1px solid var(--border);text-align:left;font-weight:600;}
.tbl td{padding:11px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
.tbl tr:last-child td{border-bottom:none;}
.tbl tr:hover td{background:var(--surface2);}
.flex{display:flex;}.flex-wrap{flex-wrap:wrap;}
.gap-6{gap:6px;}.gap-8{gap:8px;}.gap-12{gap:12px;}
.mt-8{margin-top:8px;}.mt-12{margin-top:12px;}.mb-8{margin-bottom:8px;}.mb-12{margin-bottom:12px;}
.section-title{font-size:10px;color:var(--sub);letter-spacing:1.5px;text-transform:uppercase;font-weight:600;margin-bottom:8px;}
.info-box{font-size:13px;color:var(--sub);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 13px;margin-top:4px;}
.empty-state{text-align:center;padding:44px 20px;color:var(--label);}
.empty-state .icon{font-size:34px;margin-bottom:10px;}
.exp-item-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;display:flex;align-items:flex-start;gap:12px;margin-bottom:8px;}
.thumb{width:52px;height:52px;border-radius:7px;object-fit:cover;border:1px solid var(--border);flex-shrink:0;cursor:pointer;}
.thumb-ph{width:52px;height:52px;border-radius:7px;background:var(--surface2);border:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:20px;}
.item-meta{flex:1;min-width:0;}
.item-amt{font-size:16px;font-weight:700;color:var(--amber);white-space:nowrap;}
.item-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.item-sub{font-size:11px;color:var(--sub);}
.item-actions{display:flex;gap:6px;flex-shrink:0;align-items:center;flex-direction:column;}
.setup-banner{background:var(--surface);border:1px solid var(--amber);border-radius:10px;padding:14px 18px;margin-bottom:16px;}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:2000;display:none;align-items:center;justify-content:center;}
#lightbox img{max-width:95vw;max-height:90vh;border-radius:8px;}
.lb-close{position:absolute;top:16px;right:20px;font-size:30px;color:#fff;cursor:pointer;background:none;border:none;line-height:1;}
.img-upload-label{cursor:pointer;display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px dashed var(--border);border-radius:8px;padding:12px;font-size:13px;color:var(--sub);transition:border-color .15s;}
.img-upload-label:hover{border-color:var(--teal);}
#pdf-render{position:fixed;left:-9999px;top:0;background:#fff;width:794px;font-family:'Segoe UI',Arial,sans-serif;}
#toast{position:fixed;bottom:22px;right:20px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 18px;font-size:13px;color:var(--text);z-index:9999;transform:translateY(100px);opacity:0;transition:all .3s;max-width:310px;}
#toast.show{transform:translateY(0);opacity:1;}
::-webkit-scrollbar{width:5px;height:5px;}::-webkit-scrollbar-thumb{background:var(--muted);border-radius:3px;}
.cat-travel{color:#60a5fa;}.cat-food{color:#f97316;}.cat-lodging{color:#a78bfa;}.cat-misc{color:#94a3b8;}
@media(max-width:600px){#main{padding:12px;}#header{padding:8px 12px;}#tabs{padding:0 12px;}.tab-btn{padding:9px 10px;font-size:12px;}.modal-overlay{padding:8px;}.modal-body{padding:14px;}.modal-header{padding:14px 14px 0;}.modal-footer{padding:0 14px 14px;}.item-actions{flex-direction:row;}}
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div><h1>InvoiceOS</h1><div class="sub">EXPENSE TRACKER · CONSULTANCY · GST</div></div>

<script>
'use strict';

// ══ AMOUNT IN WORDS ══════════════════════════════════════════════════════════
function amountInWords(n) {
  var num = Math.round(n); if(!num) return 'Zero Only';
  var ones=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  var tens=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  function w(x){
    if(x<20) return ones[x];
    if(x<100) return tens[Math.floor(x/10)]+(x%10?' '+ones[x%10]:'');
    if(x<1000) return ones[Math.floor(x/100)]+' Hundred'+(x%100?' '+w(x%100):'');
    if(x<100000) return w(Math.floor(x/1000))+' Thousand'+(x%1000?' '+w(x%1000):'');
    if(x<10000000) return w(Math.floor(x/100000))+' Lakh'+(x%100000?' '+w(x%100000):'');
    return w(Math.floor(x/10000000))+' Crore'+(x%10000000?' '+w(x%10000000):'');
  }
  return w(num)+' Only';
}

// ══ SUPABASE ═════════════════════════════════════════════════════════════════
var SUPABASE_URL=localStorage.getItem('sb_url')||'';
var SUPABASE_KEY=localStorage.getItem('sb_key')||'';
var sb=null;

function initSupabase(){
  if(!SUPABASE_URL||!SUPABASE_KEY){setSyncStatus('off');return;}
  try{sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);setSyncStatus('ok');document.getElementById('btn-sync').style.display='inline-block';}
  catch(e){sb=null;setSyncStatus('err');}
}
function setSyncStatus(s){
  var states={off:['var(--muted)','No sync'],ok:['var(--green)','Synced'],err:['var(--red)','Sync error'],busy:['var(--amber)','Syncing…']};
  var st=states[s]||states.off;
  document.getElementById('sync-dot').style.background=st[0];
  document.getElementById('sync-label').textContent=st[1];
}
async function sbPush(table,records){
  if(!sb||!records.length)return;
  var rows=records.map(function(r){return{id:r.id,data:r,updated_at:new Date().toISOString()};});
  var res=await sb.from(table).upsert(rows,{onConflict:'id'});
  if(res.error)throw res.error;
}
async function sbPull(table){
  if(!sb)return null;
  var res=await sb.from(table).select('data').order('updated_at',{ascending:false});
  if(res.error)throw res.error;
  // Filter out soft-deleted records (_deleted:true tombstones)
  return res.data.map(function(r){return r.data;}).filter(function(d){return !d._deleted;});
}
// ── Image sync helpers ────────────────────────────────────────────────────────
async function sbPushImages() {
  if(!sb) return;
  // Collect all ios_img_* keys from localStorage
  var rows = [];
  for(var i=0; i<localStorage.length; i++){
    var k = localStorage.key(i);
    if(k && k.startsWith('ios_img_')){
      var itemId = k.slice(8); // strip 'ios_img_'
      var data = localStorage.getItem(k);
      if(data) rows.push({id: itemId, data: data, updated_at: new Date().toISOString()});
    }
  }
  if(!rows.length) return;
  // Supabase has a 1MB row limit — split into chunks and upsert
  var CHUNK = 5;
  for(var j=0; j<rows.length; j+=CHUNK){
    var chunk = rows.slice(j, j+CHUNK);
    var res = await sb.from('item_images').upsert(chunk, {onConflict:'id'});
    if(res.error) throw res.error;
  }
}

async function sbPullImages() {
  if(!sb) return;
  var res = await sb.from('item_images').select('id,data');
  if(res.error) throw res.error;
  res.data.forEach(function(row){
    if(row.id && row.data && !localStorage.getItem('ios_img_'+row.id)){
      try{ localStorage.setItem('ios_img_'+row.id, row.data); }catch(e){}
    }
  });
}

async function syncNow(){
  if(!sb){toast('Set up Supabase first','error');return;}
  setSyncStatus('busy');
  try{
    await sbPush('tracker_items',LOCAL.getItems());
    await sbPush('claims',LOCAL.getClaims());
    await sbPush('consult',LOCAL.getConsult());
    await sbPush('parties',LOCAL.getParties());
    await sbPushImages(); // push all bill images to Supabase
    var res=await Promise.all([sbPull('tracker_items'),sbPull('claims'),sbPull('consult'),sbPull('parties')]);
    // Full replace from Supabase — this ensures deletes propagate across devices
    if(res[0])LOCAL.saveItems(res[0]);
    if(res[1])LOCAL.saveClaims(res[1]);
    if(res[2])LOCAL.saveConsult(res[2]);
    if(res[3])LOCAL.saveParties(res[3]);
    await sbPullImages(); // pull any images not in local storage
    setSyncStatus('ok');render();toast('Synced across all devices!','success');
  }catch(e){setSyncStatus('err');toast('Sync failed: '+e.message,'error');}
}
async function saveAndSync(table,records,deletedIds){
  if(!sb)return;
  setSyncStatus('busy');
  try{
    if(records&&records.length)await sbPush(table,records);
    if(deletedIds&&deletedIds.length){var r=await sb.from(table).delete().in('id',deletedIds);if(r.error)throw r.error;}
    // When saving tracker items, push any new images too
    if(table==='tracker_items') await sbPushImages();
    setSyncStatus('ok');
  }catch(e){setSyncStatus('err');console.warn('Sync:',e.message);}
}
function mergeById(local,remote){
  var map={};
  local.forEach(function(r){map[r.id]=r;});
  remote.forEach(function(r){map[r.id]=r;});
  return Object.values(map);
}

// ══ LOCAL DB ══════════════════════════════════════════════════════════════════
var LOCAL={
  _get:function(k){try{return JSON.parse(localStorage.getItem('ios_'+k)||'[]');}catch(e){return[];}},
  _set:function(k,v){localStorage.setItem('ios_'+k,JSON.stringify(v));},
  getItems:function(){return LOCAL._get('tracker_items');},
  saveItems:function(v){LOCAL._set('tracker_items',v);},
  getClaims:function(){return LOCAL._get('claims');},
  saveClaims:function(v){LOCAL._set('claims',v);},
  getConsult:function(){return LOCAL._get('consult');},
  saveConsult:function(v){LOCAL._set('consult',v);},
  getParties:function(){return LOCAL._get('parties');},
  saveParties:function(v){LOCAL._set('parties',v);},
};
// ── Migrate inline images to separate storage ────────────────────────────────
(function migrateImages(){
  // Move image_data from tracker items to ios_img_* keys
  var items = LOCAL.getItems();
  var changed = false;
  items.forEach(function(item){
    if(item.image_data && !localStorage.getItem('ios_img_'+item.id)){
      try{ localStorage.setItem('ios_img_'+item.id, item.image_data); changed=true; }catch(e){}
    }
  });
  if(changed){
    // Strip image_data from items to save space (images now in separate keys)
    var cleaned = items.map(function(i){
      var c={id:i.id,date:i.date,category:i.category,particulars:i.particulars,amount:i.amount,notes:i.notes,has_image:!!(i.image_data||localStorage.getItem('ios_img_'+i.id))};
      return c;
    });
    LOCAL.saveItems(cleaned);
  }
  // Also extract images from submitted claims to ios_img_* keys
  var claims = LOCAL.getClaims();
  claims.forEach(function(claim){
    (claim.items||[]).forEach(function(item){
      if(item.image_data && !localStorage.getItem('ios_img_'+item.id)){
        try{ localStorage.setItem('ios_img_'+item.id, item.image_data); }catch(e){}
      }
    });
  });
  // Also check tracker items that might have inline image_data (v3/v4 format)
  var trackerItems = LOCAL.getItems();
  trackerItems.forEach(function(item){
    if(item.image_data && !localStorage.getItem('ios_img_'+item.id)){
      try{ localStorage.setItem('ios_img_'+item.id, item.image_data); }catch(e){}
    }
  });
})();

// migrate old keys
(function(){
  if(localStorage.getItem('ios_pending_items')&&!localStorage.getItem('ios_tracker_items'))
    localStorage.setItem('ios_tracker_items',localStorage.getItem('ios_pending_items'));
  if(localStorage.getItem('ios_expenses')&&!localStorage.getItem('ios_claims'))
    localStorage.setItem('ios_claims',localStorage.getItem('ios_expenses'));
})();

// ══ IMAGE STORAGE (separate from items to save space) ════════════════════════
// Images stored under key ios_img_ITEMID so items array stays small
function saveItemImage(itemId,dataUrl){
  // Try direct save first
  try{localStorage.setItem('ios_img_'+itemId,dataUrl);return true;}catch(e){}
  // Storage full — try to free space by removing images for items no longer in tracker
  try{
    var activeIds = {};
    LOCAL.getItems().forEach(function(i){activeIds[i.id]=true;});
    LOCAL.getClaims().forEach(function(c){(c.items||[]).forEach(function(i){activeIds[i.id]=true;});});
    var freed = 0;
    for(var k=localStorage.length-1;k>=0;k--){
      var key=localStorage.key(k);
      if(key&&key.startsWith('ios_img_')){
        var id=key.slice(8);
        if(!activeIds[id]){localStorage.removeItem(key);freed++;}
      }
    }
    if(freed>0){
      try{localStorage.setItem('ios_img_'+itemId,dataUrl);return true;}catch(e){}
    }
  }catch(e){}
  toast('Storage full. Syncing to cloud and retrying…','error');
  return false;
}
function loadItemImage(itemId){
  return localStorage.getItem('ios_img_'+itemId)||null;
}
function removeItemImage(itemId){
  localStorage.removeItem('ios_img_'+itemId);
}

// ══ UTILS ════════════════════════════════════════════════════════════════════
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function fmt(n){try{return '\u20b9'+parseFloat(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});}catch(e){return '\u20b90.00';}}
function today(){return new Date().toISOString().slice(0,10);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function catCls(c){return{Travel:'cat-travel',Food:'cat-food',Lodging:'cat-lodging',Miscellaneous:'cat-misc'}[c]||'cat-misc';}

// ══ TOAST ════════════════════════════════════════════════════════════════════
var _tt;
function toast(msg,type){
  var t=document.getElementById('toast');
  t.textContent=msg;
  t.style.borderLeft='3px solid '+(type==='success'?'var(--green)':type==='error'?'var(--red)':'var(--indigo)');
  t.classList.add('show');clearTimeout(_tt);
  _tt=setTimeout(function(){t.classList.remove('show');},3400);
}

// ══ MODAL ════════════════════════════════════════════════════════════════════
function openModal(title,body,footer){
  document.getElementById('modal-title').textContent=title;

function clearOldImages(){
  // Remove ios_img_* entries for items/claims no longer in the system
  // and push remaining images to Supabase first
  var activeIds = {};
  LOCAL.getItems().forEach(function(i){activeIds[i.id]=true;});
  LOCAL.getClaims().forEach(function(c){(c.items||[]).forEach(function(i){activeIds[i.id]=true;});});
  var removed=[], kept=[];
  for(var k=localStorage.length-1;k>=0;k--){
    var key=localStorage.key(k);
    if(key&&key.startsWith('ios_img_')){
      var id=key.slice(8);
      if(activeIds[id]) kept.push(id);
      else { localStorage.removeItem(key); removed.push(id); }
    }
  }
  // Also remove image_data from claim records to free space
  var claims = LOCAL.getClaims();
  var changed = false;
  claims.forEach(function(c){
    (c.items||[]).forEach(function(i){
      if(i.image_data){ delete i.image_data; changed=true; }
    });
  });
  if(changed) LOCAL.saveClaims(claims);

  var used = Math.round(JSON.stringify(localStorage).length/1024);
  closeModal();
  toast('Freed '+removed.length+' old images. Kept '+kept.length+'. Storage: ~'+used+'KB', 'success');
  render();
}

function forceMigrateNow(){
  var count=0;
  // From tracker items
  LOCAL.getItems().forEach(function(item){
    if(item.image_data){
      try{localStorage.setItem('ios_img_'+item.id,item.image_data);count++;}catch(e){}
    }
  });
  // From all claims
  LOCAL.getClaims().forEach(function(claim){
    (claim.items||[]).forEach(function(item){
      if(item.image_data && !localStorage.getItem('ios_img_'+item.id)){
        try{localStorage.setItem('ios_img_'+item.id,item.image_data);count++;}catch(e){}
      }
    });
  });
  closeModal();
  render();
  toast('Migration done. '+count+' image(s) extracted to separate keys.','success');
}

function clearSupabase(){
  localStorage.removeItem('sb_url');localStorage.removeItem('sb_key');
  SUPABASE_URL='';SUPABASE_KEY='';sb=null;
  document.getElementById('btn-sync').style.display='none';
  setSyncStatus('off');closeModal();toast('Disconnected','success');
}

// ── Image compression helper ──────────────────────────────────────────────────
function compressAndStore(file, callback) {
  // callback(dataUrl) — dataUrl is null on failure
  var reader = new FileReader();
  reader.onerror = function(){ toast('Could not read file','error'); callback(null); };
  reader.onload = function(e) {
    var img = new Image();
    img.onerror = function(){ toast('Could not load image','error'); callback(null); };
    img.onload = function() {
      var MAX = 1200;
      var w = img.width, h = img.height;
      if(w > MAX){ h = Math.round(h * MAX / w); w = MAX; }
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      var q = 0.72;
      var dataUrl = canvas.toDataURL('image/jpeg', q);
      if(dataUrl.length > 1400000){ dataUrl = canvas.toDataURL('image/jpeg', 0.5); }
      callback(dataUrl);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

// ── handleBillImage — writes to hidden textarea in modal DOM ──────────────────
function handleBillImage(input, taId, lblId, prevId) {
  var file = input.files[0];
  if(!file) return;
  compressAndStore(file, function(dataUrl) {
    if(!dataUrl) return;
    var ta = document.getElementById(taId);
    if(ta) ta.value = dataUrl;
    var lbl = document.getElementById(lblId);
    if(lbl){ var kb=Math.round(dataUrl.length*0.75/1024); lbl.textContent='✓ '+file.name.slice(0,20)+(file.name.length>20?'…':'')+' ('+kb+'KB)'; }
    var prev = document.getElementById(prevId);
    if(prev) prev.innerHTML='<img src="'+dataUrl+'" style="max-height:100px;border-radius:6px;border:1px solid var(--border);margin-top:4px">';
  });
}

function saveNewItem() {
  var date  = document.getElementById('ai-date').value;
  var cat   = document.getElementById('ai-cat').value;
  var part  = document.getElementById('ai-part').value.trim();
  var amt   = parseFloat(document.getElementById('ai-amt').value||0);
  var notes = document.getElementById('ai-notes').value.trim();
  var imgData = document.getElementById('ai-imgdata').value||'';

  if(!part){ toast('Please enter a description','error'); return; }
  if(!amt){  toast('Please enter the amount','error'); return; }

  var itemId = uid();
  var hasImg = false;
  if(imgData){
    hasImg = saveItemImage(itemId, imgData);
    // Verify written
    if(!localStorage.getItem('ios_img_'+itemId)) hasImg = false;
  }

  var items = LOCAL.getItems();
  items.unshift({id:itemId, date:date, category:cat, particulars:part, amount:amt, notes:notes, has_image:hasImg});
  LOCAL.saveItems(items);
  saveAndSync('tracker_items', items);
  closeModal(); render(); toast('Expense added!' + (hasImg ? ' (image saved ✓)' : ''), 'success');
}

function saveEditItem(itemId) {
  var date  = document.getElementById('ai-date').value;
  var cat   = document.getElementById('ai-cat').value;
  var part  = document.getElementById('ai-part').value.trim();
  var amt   = parseFloat(document.getElementById('ai-amt').value||0);
  var notes = document.getElementById('ai-notes').value.trim();
  var imgData = document.getElementById('ai-imgdata').value||'';

  if(!part){ toast('Please enter a description','error'); return; }
  if(!amt){  toast('Please enter the amount','error'); return; }

  // New selection from textarea; fall back to stored reference (not localStorage re-read)
  var finalImgData = imgData || window._editItemImg || '';
  window._editItemImg = null; // clear after use

  var hasImg = false;
  if(finalImgData){
    hasImg = saveItemImage(itemId, finalImgData);
    // Verify it was actually written
    if(!localStorage.getItem('ios_img_'+itemId)){
      hasImg = false;
    }
  }

  var items = LOCAL.getItems().map(function(i){
    return i.id===itemId ? {id:itemId,date:date,category:cat,particulars:part,amount:amt,notes:notes,has_image:hasImg} : i;
  });
  LOCAL.saveItems(items);
  saveAndSync('tracker_items', items);
  closeModal();
  render();
  // Show confirmation with image status
  toast('Updated! ' + (hasImg ? '(image saved ✓)' : '(no image)'), 'success');
}

function deleteItem(itemId) {
  if(!confirm('Delete this expense?')) return;
  removeItemImage(itemId);
  // Soft-delete: push a tombstone record to Supabase so other devices know it's deleted
  // Then remove locally
  if(sb){
    var tombstone = [{id:itemId, _deleted:true, updated_at:new Date().toISOString()}];
    sb.from('tracker_items').upsert(
      tombstone.map(function(r){return{id:r.id,data:r,updated_at:r.updated_at};}),
      {onConflict:'id'}
    ).then(function(){});
  }
  var items = LOCAL.getItems().filter(function(i){return i.id!==itemId;});
  LOCAL.saveItems(items);
  render(); toast('Deleted','success');
}

function doSubmit() {
  // Read pdfOnly from hidden field — no boolean-vs-string confusion
  var pdfOnly = document.getElementById('sc-pdfonly').value === '1';
  var cid     = document.getElementById('sc-cid').value;
  var date    = document.getElementById('sc-date').value;
  var to      = document.getElementById('sc-to').value.trim();
  var purpose = document.getElementById('sc-purpose').value.trim();
  var notes   = document.getElementById('sc-notes').value.trim();

  if(!to||!purpose){ toast('Submit To and Purpose are required','error'); return; }

  var items = LOCAL.getItems();
  var total = items.reduce(function(s,i){return s+(parseFloat(i.amount)||0);},0);

  // Attach images to items for PDF (load from separate storage)
  var itemsWithImages = items.map(function(i){
    var img = loadItemImage(i.id) || i.image_data || null;
    if(!loadItemImage(i.id)&&i.image_data){saveItemImage(i.id,i.image_data);}
    return {id:i.id, date:i.date, category:i.category, particulars:i.particulars,
            amount:i.amount, notes:i.notes, image_data: img};
  });

  var claimObj = {
    id:uid(), claim_id:cid, purpose:purpose, submitted_to:to,
    claim_date:date, submitter_name:MY.name, notes:notes, total_amount:total,
    items:itemsWithImages,
    paid_amount:0, paid_date:null, status:'unpaid'
  };

  if(!pdfOnly) {
    // Store claim WITH image_data so regenClaimPDF always works
    // itemsWithImages already has images loaded from ios_img_* or inline
    // Store claim WITHOUT image_data — images live in ios_img_* and Supabase item_images
    var claimForStorage = JSON.parse(JSON.stringify(claimObj));
    claimForStorage.items = items.map(function(i){
      return {id:i.id,date:i.date,category:i.category,particulars:i.particulars,
              amount:i.amount,notes:i.notes,has_image:!!(loadItemImage(i.id)||i.image_data)};
    });
    var claims = LOCAL.getClaims();
    claims.unshift(claimForStorage);
    LOCAL.saveClaims(claims);
    // Soft-delete each submitted tracker item in Supabase before clearing locally
    if(sb){
      var now = new Date().toISOString();
      var tombstones = items.map(function(i){return{id:i.id,data:{id:i.id,_deleted:true},updated_at:now};});
      sb.from('tracker_items').upsert(tombstones,{onConflict:'id'}).then(function(){});
    }
    LOCAL.saveItems([]);
    saveAndSync('claims', claims);
  }

  closeModal();
  render();
  toast('Generating PDF…');
  setTimeout(function(){ buildAndDownloadExpensePDF(claimObj, !pdfOnly); }, 200);
}

function deleteClaim(id){
  if(!confirm('Delete this claim?'))return;
  if(sb){
    sb.from('claims').upsert([{id:id,data:{id:id,_deleted:true},updated_at:new Date().toISOString()}],{onConflict:'id'}).then(function(){});
  }
  var claims=LOCAL.getClaims().filter(function(c){return c.id!==id;});
  LOCAL.saveClaims(claims);render();toast('Deleted','success');
}

function regenClaimPDF(id) {
  var c = LOCAL.getClaims().find(function(x){return x.id===id;});
  if(!c) return;
  // Reload images from separate storage for items that have them
  var itemsWithImages = (c.items||[]).map(function(i){
    var img = loadItemImage(i.id) || i.image_data || null;
    return {id:i.id,date:i.date,category:i.category,particulars:i.particulars,
            amount:i.amount,notes:i.notes,image_data:img};
  });
  var claimWithImages = JSON.parse(JSON.stringify(c));
  claimWithImages.items = itemsWithImages;
  toast('Generating PDF…');
  setTimeout(function(){buildAndDownloadExpensePDF(claimWithImages,false);},200);
}

function recordClaimPayment(id){
  var c=LOCAL.getClaims().find(function(x){return x.id===id;});if(!c)return;
  openModal('Record Reimbursement — '+c.claim_id,
    '<div class="info-box mb-12">Claimed: <strong style="color:var(--amber)">'+fmt(c.total_amount)+'</strong>'
    +' &nbsp;|&nbsp; Previously received: <strong style="color:var(--green)">'+fmt(c.paid_amount||0)+'</strong></div>'
    +'<div class="form-row">'
    +'<div class="field"><label>Amount Received (₹)</label><input type="number" id="rp-amt" placeholder="0.00" step="0.01"></div>'
    +'<div class="field"><label>Date Received</label><input type="date" id="rp-date" value="'+today()+'"></div>'
    +'</div>'
    +'<input type="hidden" id="rp-id" value="'+esc(id)+'">'
    +'<input type="hidden" id="rp-total" value="'+c.total_amount+'">',
    '<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>'

function saveClaimPayment(){
  var id=document.getElementById('rp-id').value;
  var total=parseFloat(document.getElementById('rp-total').value);
  var paid=parseFloat(document.getElementById('rp-amt').value||0);
  var date=document.getElementById('rp-date').value;
  var status=(Math.abs(paid-total)<1||paid>total)?'paid':paid>0?'partial':'unpaid';
  var claims=LOCAL.getClaims();
  var c=claims.find(function(x){return x.id===id;});
  if(c){c.paid_amount=paid;c.paid_date=date;c.status=status;}
  LOCAL.saveClaims(claims);saveAndSync('claims',claims);
  closeModal();render();toast('Payment recorded!','success');
}

// ══ PDF — Expense Claim ══════════════════════════════════════════════════════
function buildAndDownloadExpensePDF(claim, clearedMsg) {
  var container = document.getElementById('pdf-render');
  var jsPDF = window.jspdf.jsPDF;
  var pdf = new jsPDF({orientation:'portrait', unit:'mm', format:'a4'});
  var pdfW = pdf.internal.pageSize.getWidth();   // 210mm
  var pdfH = pdf.internal.pageSize.getHeight();  // 297mm

  var imgItems = (claim.items||[]).filter(function(li){return li.image_data;});

  // ── Page 1: statement (no bill images) ──────────────────────────────────
  container.innerHTML = buildExpensePDFHTML(claim, true); // true = exclude images section

  function renderContainer(scale) {
    return new Promise(function(resolve, reject) {
      setTimeout(function() {
        html2canvas(container, {scale: scale||2, useCORS:true, logging:false, backgroundColor:'#fff'})
          .then(resolve).catch(reject);
      }, 350);
    });
  }

  renderContainer(2)
    .then(function(canvas1) {
      var d1 = canvas1.toDataURL('image/jpeg', 0.92);
      var h1 = (canvas1.height * pdfW) / canvas1.width;
      // Statement fits on one page (scale down if taller than A4)
      if(h1 > pdfH) {
        var scale = pdfH / h1;
        pdf.addImage(d1, 'JPEG', 0, 0, pdfW * scale, pdfH);
      } else {
        pdf.addImage(d1, 'JPEG', 0, 0, pdfW, h1);
      }
      container.innerHTML = '';

      // ── Pages 2+: 2 bill images per page ────────────────────────────────
      if(!imgItems.length) return Promise.resolve();

      // Process pairs sequentially
      var pairs = [];
      for(var i=0; i<imgItems.length; i+=2) {
        pairs.push(imgItems.slice(i, i+2));
      }

      return pairs.reduce(function(chain, pair, pageIdx) {
        return chain.then(function() {
          pdf.addPage();
          container.innerHTML = buildBillPageHTML(pair, pageIdx+1, pairs.length);
          // Load images
          var imgs = container.querySelectorAll('img[data-src]');
          var loads = [];
          imgs.forEach(function(img){
            var src = img.getAttribute('data-src');
            if(src){ img.src=src; loads.push(new Promise(function(res){img.onload=res;img.onerror=res;})); }
          });
          return Promise.all(loads)
            .then(function(){ return renderContainer(2); })
            .then(function(canvas) {
              var d = canvas.toDataURL('image/jpeg', 0.92);
              var h = (canvas.height * pdfW) / canvas.width;
              pdf.addImage(d, 'JPEG', 0, 0, pdfW, Math.min(h, pdfH));
              container.innerHTML = '';
            });
        });
      }, Promise.resolve());
    })
    .then(function() {
      pdf.save(claim.claim_id + '.pdf');
      toast(clearedMsg ? 'PDF saved! Tracker cleared.' : 'PDF downloaded!', 'success');
    })
    .catch(function(e){ toast('PDF error: ' + e.message, 'error'); })
    .finally(function(){ container.innerHTML = ''; });
}

function buildBillPageHTML(items, pageNum, totalPages) {
  // Renders 1 or 2 bill images, each taking half the A4 page height
  var slotH = items.length === 1 ? 680 : 320; // px height per image slot (794px wide canvas)
  var html = '<div style="background:#fff;padding:20px 30px;width:794px;font-family:Arial,sans-serif;color:#111827">';

  // Page header
  html += '<div style="border-bottom:2px solid #111827;padding-bottom:8px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:baseline">';
  html += '<div style="font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase">Supporting Bills &amp; Receipts</div>';
  html += '<div style="font-size:10px;color:#6b7280">Page '+(pageNum+1)+' of '+(totalPages+1)+'</div>';
  html += '</div>';

  items.forEach(function(li, i) {
    html += '<div style="margin-bottom:'+(items.length===1?'0':'20px')+';border:1px solid #e2e8f0;border-radius:8px;overflow:hidden">';

    // Caption bar
    html += '<div style="background:#f8fafc;padding:8px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e2e8f0">';
    html += '<div>';
    html += '<span style="font-weight:700;font-size:12px">'+esc(li.particulars||'—')+'</span>';
    html += (li.date ? '<span style="font-size:11px;color:#6b7280;margin-left:10px">'+li.date+'</span>' : '');
    html += (li.category ? '<span style="font-size:10px;background:#dbeafe;color:#1e40af;padding:1px 7px;border-radius:10px;font-weight:600;margin-left:8px">'+esc(li.category)+'</span>' : '');
    html += '</div>';
    html += '<div style="font-size:13px;font-weight:700">₹'+parseFloat(li.amount||0).toLocaleString('en-IN',{minimumFractionDigits:2})+'</div>';
    html += '</div>';

    // Image — fill available space
    html += '<div style="text-align:center;background:#f1f5f9;padding:10px">';
    html += '<img data-src="'+li.image_data+'" style="max-width:730px;max-height:'+slotH+'px;width:auto;height:auto;object-fit:contain;border-radius:4px">';
    html += '</div>';

    html += '</div>';
  });

  html += '</div>';
  return html;
}

function fillParty(id){
  var p=LOCAL.getParties().find(function(x){return x.id===id;});
  if(p){document.getElementById('con-party-name').value=p.name;document.getElementById('con-party-gstin').value=p.gstin||'';}
}

function recalcConsult(){
  var b=parseFloat((document.getElementById('con-amt')&&document.getElementById('con-amt').value)||0);
  var gp=parseFloat((document.getElementById('con-gst-rate')&&document.getElementById('con-gst-rate').value)||18)/100;
  var tp=parseFloat((document.getElementById('con-tds')&&document.getElementById('con-tds').value)||10)/100;
  var gt=(document.getElementById('con-gst-type')&&document.getElementById('con-gst-type').value)||'CGST+SGST';
  var ga=b*gp;var tot=b+ga;var tds=tot*tp;var net=tot-tds;
  var gs=gt==='CGST+SGST'?'CGST '+fmt(ga/2)+' + SGST '+fmt(ga/2):'IGST '+fmt(ga);
  var el=document.getElementById('con-calc');
  if(el)el.innerHTML='Base <strong>'+fmt(b)+'</strong> + '+gs+' = Total <strong style="color:var(--indigo)">'+fmt(tot)+'</strong> &nbsp;|\u00a0 TDS (records): <strong style="color:var(--violet)">'+fmt(tds)+'</strong> \u2192 Net Expected: <strong style="color:var(--green)">'+fmt(net)+'</strong>';
}

function saveConsultInvoice(){
  var iid=document.getElementById('con-iid').value;
  var pname=document.getElementById('con-party-name').value.trim();
  var pgstin=document.getElementById('con-party-gstin').value.trim();
  var svc=document.getElementById('con-svc').value.trim();
  var site=document.getElementById('con-site').value.trim();
  var attn=document.getElementById('con-attn').value.trim();
  var b=parseFloat(document.getElementById('con-amt').value||0);
  var gp=parseFloat(document.getElementById('con-gst-rate').value||18)/100;
  var tp=parseFloat(document.getElementById('con-tds').value||10)/100;
  var gt=document.getElementById('con-gst-type').value;
  var invDate=document.getElementById('con-date').value;
  if(!pname||!svc||!b){toast('Party, service and amount required','error');return;}
  var ga=b*gp;var tot=b+ga;
  var inv={id:uid(),invoice_id:iid,party_name:pname,party_gstin:pgstin,party_address:'',party_pan:'',site:site,attention:attn,service:svc,base_amount:b,gst_rate:gp,gst_type:gt,gst_amount:ga,total_with_gst:tot,tds_rate:tp,invoice_date:invDate,my_name:MY.name,my_gstin:MY.gstin,paid_amount:0,tds_deducted:0,paid_date:null,status:'unpaid',gst_filed:false};
  var cons=LOCAL.getConsult();cons.unshift(inv);LOCAL.saveConsult(cons);
  saveAndSync('consult',cons);
  closeModal();currentTab='consult';render();toast('Invoice created!','success');
}

function deleteConsult(id){
  if(!confirm('Delete this invoice?'))return;
  if(sb){

function recordConPayment(id){
  var inv=LOCAL.getConsult().find(function(c){return c.id===id;});if(!inv)return;
  var tdsAmt=(inv.total_with_gst||0)*(inv.tds_rate||0.1);var net=(inv.total_with_gst||0)-tdsAmt;
  openModal('Record Payment \u2014 '+inv.invoice_id,
    '<div class="info-box mb-12">Total: <strong style="color:var(--indigo)">'+fmt(inv.total_with_gst)+'</strong>'
    +' | TDS (records): <strong style="color:var(--violet)">'+fmt(tdsAmt)+'</strong>'
    +' | Net Expected: <strong style="color:var(--green)">'+fmt(net)+'</strong></div>'
    +'<div class="form-row">'
    +'<div class="field"><label>Amount Received (₹)</label><input type="number" id="cp-amt" value="'+net.toFixed(2)+'" step="0.01"></div>'
    +'<div class="field"><label>TDS Deducted (₹)</label><input type="number" id="cp-tds" value="'+tdsAmt.toFixed(2)+'" step="0.01"></div>'
    +'<div class="field"><label>Payment Date</label><input type="date" id="cp-date" value="'+today()+'"></div>'
    +'</div>'

function saveConPayment(){
  var id=document.getElementById('cp-id').value;
  var net=parseFloat(document.getElementById('cp-net').value);
  var paid=parseFloat(document.getElementById('cp-amt').value||0);
  var tds=parseFloat(document.getElementById('cp-tds').value||0);
  var date=document.getElementById('cp-date').value;
  var status=(Math.abs(paid-net)<1||paid>net)?'paid':paid>0?'partial':'unpaid';
  var cons=LOCAL.getConsult();var c=cons.find(function(x){return x.id===id;});
  if(c){c.paid_amount=paid;c.tds_deducted=tds;c.paid_date=date;c.status=status;}
  LOCAL.saveConsult(cons);saveAndSync('consult',cons);closeModal();render();toast('Payment recorded!','success');
}

function generateConsultPDF(id){
  var inv=LOCAL.getConsult().find(function(c){return c.id===id;});if(!inv)return;
  toast('Generating PDF\u2026');
  var container=document.getElementById('pdf-render');
  container.innerHTML=buildConsultPDFHTML(inv);
  setTimeout(function(){
    var jsPDF=window.jspdf.jsPDF;
    var pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
    html2canvas(container,{scale:2,useCORS:true,logging:false,backgroundColor:'#fff'}).then(function(canvas){
      var imgData=canvas.toDataURL('image/jpeg',0.93);
      var pdfW=pdf.internal.pageSize.getWidth();
      var pdfH=(canvas.height*pdfW)/canvas.width;
      pdf.addImage(imgData,'JPEG',0,0,pdfW,Math.min(pdfH,297));
      pdf.save(inv.invoice_id+'.pdf');
      toast('PDF downloaded!','success');
    }).catch(function(e){toast('PDF error: '+e.message,'error');})
    .finally(function(){container.innerHTML='';});
  },300);
}

function renderGST(){
  var cons=LOCAL.getConsult();var byMonth={};
  cons.forEach(function(c){var m=(c.invoice_date||'').slice(0,7);if(!byMonth[m])byMonth[m]={gst:0,filed:0,unfiled:0,invs:[]};byMonth[m].gst+=c.gst_amount||0;if(c.gst_filed)byMonth[m].filed+=c.gst_amount||0;else byMonth[m].unfiled+=c.gst_amount||0;byMonth[m].invs.push(c);});
  var months=Object.keys(byMonth).sort().reverse();
  var totalUnfiled=cons.filter(function(c){return !c.gst_filed;}).reduce(function(s,c){return s+(c.gst_amount||0);},0);
  var totalFiled=cons.filter(function(c){return c.gst_filed;}).reduce(function(s,c){return s+(c.gst_amount||0);},0);
  return '<div class="grid-stats mb-16">'
    +'<div class="stat-card" style="border-left:3px solid var(--amber)"><div class="stat-label">Pending GST Payable</div><div class="stat-value" style="color:var(--amber)">'+fmt(totalUnfiled)+'</div><div class="stat-sub">'+cons.filter(function(c){return !c.gst_filed;}).length+' unfiled</div></div>'
    +'<div class="stat-card" style="border-left:3px solid var(--green)"><div class="stat-label">Total Filed</div><div class="stat-value" style="color:var(--green)">'+fmt(totalFiled)+'</div><div class="stat-sub">'+cons.filter(function(c){return c.gst_filed;}).length+' invoices</div></div>'
    +'</div>'
    +(months.length?months.map(function(m){
      var d=byMonth[m];
      return '<div class="card mt-12">'
        +'<div class="flex" style="justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px"><strong>'+m+'</strong>'
        +'<div class="flex gap-8 flex-wrap" style="font-size:12px;color:var(--sub)">'
        +'<span>GST: <strong style="color:var(--amber)">'+fmt(d.gst)+'</strong></span>'
        +'<span>Unfiled: <strong style="color:var(--red)">'+fmt(d.unfiled)+'</strong></span>'
        +'<span>Filed: <strong style="color:var(--green)">'+fmt(d.filed)+'</strong></span>'
        +'</div></div>'
        +'<table class="tbl"><thead><tr><th>Invoice</th><th>Party</th><th>Base</th><th>GST</th><th>GST Amt</th><th>Status</th><th></th></tr></thead><tbody>'
        +d.invs.map(function(c){return '<tr>'
          +'<td style="font-size:12px;color:var(--indigo);font-weight:600">'+esc(c.invoice_id)+'</td>'
          +'<td style="font-size:12px">'+esc(c.party_name)+'</td>'
          +'<td style="font-size:12px">'+fmt(c.base_amount)+'</td>'
          +'<td style="font-size:12px">'+esc(c.gst_type)+' @ '+((c.gst_rate||0)*100).toFixed(0)+'%</td>'
          +'<td style="font-weight:700;color:var(--amber)">'+fmt(c.gst_amount)+'</td>'
          +'<td><span class="badge '+(c.gst_filed?'badge-green':'badge-amber')+'">'+(c.gst_filed?'Filed':'Pending')+'</span></td>'
          +'<td>'+(!c.gst_filed?'<button class="btn btn-xs btn-amber" onclick="markGSTFiled(\''+c.id+'\')">Mark Filed</button>':'—')+'</td>'
          +'</tr>';}).join('')
        +'</tbody></table></div>';
    }).join(''):'<div class="empty-state"><div class="icon">\u20b9</div><p>No consultancy invoices yet</p></div>');
}

  var claimTotal=claims.reduce(function(s,c){return s+(c.total_amount||0);},0);
  var claimPaid=claims.reduce(function(s,c){return s+(c.paid_amount||0);},0);
  var conTotal=cons.reduce(function(s,c){return s+(c.total_with_gst||0);},0);
  var conPaid=cons.reduce(function(s,c){return s+(c.paid_amount||0);},0);
  var gstPayable=cons.filter(function(c){return !c.gst_filed;}).reduce(function(s,c){return s+(c.gst_amount||0);},0);
  var tdsTotal=cons.reduce(function(s,c){return s+(c.tds_deducted||0);},0);
  function sc(l,v,s,col){return '<div class="stat-card" style="border-left:3px solid '+col+'"><div class="stat-label">'+l+'</div><div class="stat-value" style="color:'+col+'">'+v+'</div><div class="stat-sub">'+s+'</div></div>';}
  return '<div class="grid-stats">'
    +sc('In Tracker',fmt(trackTotal),items.length+' items pending','var(--amber)')
    +sc('Total Claimed',fmt(claimTotal),fmt(claimPaid)+' reimbursed','var(--teal)')
    +sc('Claim Balance',fmt(claimTotal-claimPaid),'Yet to receive','var(--red)')
    +sc('Consultancy Billed',fmt(conTotal),fmt(conPaid)+' received','var(--indigo)')
    +sc('GST Payable',fmt(gstPayable),'Unfiled','var(--amber)')
    +sc('TDS Deducted',fmt(tdsTotal),'Track in 26AS','var(--violet)')
    +'</div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:4px">'
    +'<div><div class="section-title">Recent Claims</div>'
    +(claims.slice(0,4).map(function(c){return '<div class="card mt-8" style="padding:10px 14px;border-left:3px solid var(--teal)"><div class="flex" style="justify-content:space-between;flex-wrap:wrap;gap:6px"><div><div style="font-size:13px;font-weight:600">'+esc(c.claim_id)+'</div><div style="font-size:11px;color:var(--sub)">'+esc(c.purpose)+' \u00b7 '+esc(c.claim_date)+'</div></div><div style="text-align:right"><div style="font-size:13px;font-weight:700;color:var(--teal)">'+fmt(c.total_amount)+'</div>'+badge(c.status)+'</div></div></div>';}).join('')||'<div style="color:var(--muted);font-size:13px;padding:16px 0">No claims yet</div>')
    +'</div>'
    +'<div><div class="section-title">Recent Invoices</div>'
    +(cons.slice(0,4).map(function(c){return '<div class="card mt-8" style="padding:10px 14px;border-left:3px solid var(--indigo)"><div class="flex" style="justify-content:space-between;flex-wrap:wrap;gap:6px"><div><div style="font-size:13px;font-weight:600">'+esc(c.invoice_id)+'</div><div style="font-size:11px;color:var(--sub)">'+esc(c.party_name)+' \u00b7 '+esc(c.invoice_date)+'</div></div><div style="text-align:right"><div style="font-size:13px;font-weight:700;color:var(--indigo)">'+fmt(c.total_with_gst)+'</div>'+badge(c.status)+'</div></div></div>';}).join('')||'<div style="color:var(--muted);font-size:13px;padding:16px 0">No invoices yet</div>')
    +'</div></div>';
}

// ══ BACKUP / RESTORE ══════════════════════════════════════════════════════════
function exportData(){
  var data={tracker_items:LOCAL.getItems(),claims:LOCAL.getClaims(),consult:LOCAL.getConsult(),parties:LOCAL.getParties(),exported_at:new Date().toISOString(),version:'4.0'};
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='InvoiceOS_backup_'+today()+'.json';a.click();
  toast('Backup downloaded!','success');
}
function openImportModal(){
  openModal('Restore from Backup',
    '<p style="font-size:13px;color:var(--sub);margin-bottom:14px">Select an <strong>InvoiceOS_backup_*.json</strong> file. New records are merged in without overwriting existing ones.</p>'
    +'<div class="field"><label>Backup JSON File</label><input type="file" id="import-file" accept=".json" style="font-size:12px;padding:6px" onchange="previewImport(this)"></div>'
    +'<div id="import-preview" style="margin-top:10px;font-size:12px;color:var(--sub)"></div>',
    '<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>'
    +'<button class="btn btn-amber" onclick="runImport()">Restore</button>'
  );
}
function previewImport(input){
  var file=input.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{var d=JSON.parse(e.target.result);
      document.getElementById('import-preview').innerHTML='<div style="background:var(--surface2);border-radius:8px;padding:10px;border:1px solid var(--border)">Found: <strong>'+(d.tracker_items||d.pending_items||d.pending||[]).length+'</strong> tracker items, <strong>'+(d.claims||d.expenses||[]).length+'</strong> claims, <strong>'+(d.consult||[]).length+'</strong> invoices, <strong>'+(d.parties||[]).length+'</strong> parties<br><span style="color:var(--label);font-size:11px">Exported: '+(d.exported_at||'unknown')+'</span></div>';
    }catch(err){document.getElementById('import-preview').innerHTML='<span style="color:var(--red)">Invalid JSON file.</span>';}
  };reader.readAsText(file);
}
function runImport(){
  var fileEl=document.getElementById('import-file');
  if(!fileEl||!fileEl.files[0]){toast('Please select a file','error');return;}
  var reader=new FileReader();
  reader.onload=function(e){
    try{var d=JSON.parse(e.target.result);
      function merge(existing,incoming){var ids={};existing.forEach(function(r){ids[r.id]=true;});return(incoming||[]).filter(function(r){return !ids[r.id];}).concat(existing);}
      var before={i:LOCAL.getItems().length,c:LOCAL.getClaims().length,co:LOCAL.getConsult().length};
      LOCAL.saveItems(merge(LOCAL.getItems(),d.tracker_items||d.pending_items||d.pending||[]));
      LOCAL.saveClaims(merge(LOCAL.getClaims(),d.claims||d.expenses||[]));
      LOCAL.saveConsult(merge(LOCAL.getConsult(),d.consult||[]));
      LOCAL.saveParties(merge(LOCAL.getParties(),d.parties||[]));
      var ai=LOCAL.getItems().length-before.i;var ac=LOCAL.getClaims().length-before.c;var aco=LOCAL.getConsult().length-before.co;
      closeModal();render();toast('Restored: '+ai+' items, '+ac+' claims, '+aco+' invoices','success');
    }catch(err){toast('Parse error: '+err.message,'error');}
  };reader.readAsText(fileEl.files[0]);
}

// ══ INIT ══════════════════════════════════════════════════════════════════════
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();});
initSupabase();
render();
if(sb){setTimeout(syncNow,800);}
</script>
